claim_id: CE-CAP-PLUGIN-001
claim_type: capability
owner: calibrated_explanations
status: current

adr_links:
  - ADR-006
  - ADR-013
  - ADR-015
  - ADR-026
  - ADR-033

claim_text: >
  calibrated_explanations exposes an extensible plugin system through the
  calibrated_explanations.plugins module, defining protocols for custom explanation
  backends and interval calibrators.

atomic_rationale: >
  This claim maps to one requirement because the verifiable scope at this time is
  protocol importability (CE-REQ-PLUGIN-DOC-001, documentation_boundary). Full plugin
  lifecycle verification (registration, dispatch, fallback) requires internal API access
  not stable for public verification and is deferred as a gap. No separate API contract
  requirement beyond protocol importability is warranted without a public plugin
  registration surface.

public_api:
  - calibrated_explanations.plugins.base.ExplainerPlugin
  - calibrated_explanations.plugins.intervals.IntervalCalibratorPlugin

task_types:
  - binary_classification
  - multiclass_classification
  - regression
  - probabilistic_regression

requirements:
  - CE-REQ-PLUGIN-DOC-001

verification:
  proves:
    - api_contract
  verification_type: automated_executable_evidence
assumptions:
  - This capability is verified by the executable evidence targets named by its requirement.
  - Metadata linkage checks are drift guards only and do not prove this capability behavior.

evidence_required:
  - commit_sha
  - package_version
  - test_id
  - result
