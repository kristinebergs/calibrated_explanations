claim_id: CE-CAP-CACHE-001
claim_type: capability
owner: calibrated_explanations
status: current
adr_links:
  - ADR-003

claim_text: >
  Caching is opt-in, transparent to public APIs, and governed by deterministic key and fallback visibility constraints.

atomic_rationale: >
  This governance claim maps to one requirement because ADR-003 cache compliance is a
  single governance policy: opt-in caching with deterministic keys and visible fallbacks.
  The transparency constraint (invisible to public APIs) cannot be decomposed into
  independent requirements without modifying the public API surface to expose cache state.

public_api: []

task_types:
  - governance

requirements:
  - CE-REQ-CACHE-GOV-001

verification:
  proves:
    - runtime_behavior
  verification_type: automated_executable_evidence
assumptions:
  - This capability is verified by the executable evidence targets named by its requirement.
  - Metadata linkage checks are drift guards only and do not prove this capability behavior.

evidence_required:
  - commit_sha
  - package_version
  - test_id
  - result
