claim_id: CE-CAP-DEPREC-001
claim_type: capability
owner: calibrated_explanations
status: current
adr_links:
  - ADR-011

claim_text: >
  Deprecations follow the accepted migration lifecycle, including visible warnings and documented removal windows.

atomic_rationale: >
  This governance claim maps to one requirement because ADR-011 deprecation compliance
  is a single lifecycle policy: emitting DeprecationWarning and documenting the removal
  window. Decomposing into per-API or per-version requirements would create obligations
  that duplicate the single canonical ADR-011 enforcement check already defined.

public_api: []

task_types:
  - governance

requirements:
  - CE-REQ-DEPREC-GOV-001

verification:
  proves:
    - quality_gate
  verification_type: automated_executable_evidence
assumptions:
  - This capability is verified by the executable evidence targets named by its requirement.
  - Metadata linkage checks are drift guards only and do not prove this capability behavior.

evidence_required:
  - commit_sha
  - package_version
  - test_id
  - result
