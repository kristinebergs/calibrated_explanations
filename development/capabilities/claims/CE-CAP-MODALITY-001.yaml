claim_id: CE-CAP-MODALITY-001
claim_type: capability
owner: calibrated_explanations
status: current
adr_links:
  - ADR-033

claim_text: >
  Non-tabular modality extensions use plugin metadata and external packages rather than entering the core tabular implementation.

atomic_rationale: >
  This governance claim maps to one requirement because ADR-033 modality extension
  compliance is a single plugin boundary policy: non-tabular extensions must not modify
  core. No public API for modality extension registration is available for behavioral
  TIF testing. The governance check is whether the extension boundary rule is documented
  and enforced.

public_api: []

task_types:
  - governance

requirements:
  - CE-REQ-MODALITY-GOV-001

verification:
  proves:
    - plugin_behavior
  verification_type: automated_executable_evidence
assumptions:
  - This capability is verified by the executable evidence targets named by its requirement.
  - Metadata linkage checks are drift guards only and do not prove this capability behavior.

evidence_required:
  - commit_sha
  - package_version
  - test_id
  - result
