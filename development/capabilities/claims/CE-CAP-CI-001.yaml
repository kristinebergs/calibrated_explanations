claim_id: CE-CAP-CI-001
claim_type: capability
owner: calibrated_explanations
status: current
adr_links:
  - ADR-035

claim_text: >
  CI workflow changes comply with reusable workflow, least-privilege, pinning, constraints, and local reproducibility policy.

atomic_rationale: >
  This governance claim maps to one requirement because ADR-035 CI governance is a single
  quality gate: .github/workflows compliance policy. Individual CI rules (least-privilege,
  pinning, constraints) are sub-checks of the same policy, not independent capability
  requirements with separate observable behaviors.

public_api: []

task_types:
  - governance

requirements:
  - CE-REQ-CI-GOV-001

verification:
  proves:
    - quality_gate
  verification_type: automated_executable_evidence
assumptions:
  - This capability is verified by the executable evidence targets named by its requirement.
  - Metadata linkage checks are drift guards only and do not prove this capability behavior.

evidence_required:
  - commit_sha
  - package_version
  - test_id
  - result
