claim_id: CE-CAP-PLOTSPEC-001
claim_type: capability
owner: calibrated_explanations
status: current
adr_links:
  - ADR-036
  - ADR-037

claim_text: >
  PlotSpec-enabled visualization paths preserve backend-independent semantic plot intent through canonical PlotSpec objects and validated renderer boundaries.

atomic_rationale: >
  This governance claim maps to one requirement because ADR-036/ADR-037 PlotSpec compliance
  is a single visualization governance check: PlotSpec canonical model validation and
  renderer boundary enforcement. Decomposing into canonical model vs renderer boundary
  requirements would test sub-components of the same PlotSpec contract rather than
  independent capabilities.

public_api: []

task_types:
  - governance

requirements:
  - CE-REQ-PLOTSPEC-GOV-001

verification:
  proves:
    - visualization_behavior
  verification_type: automated_executable_evidence
assumptions:
  - This capability is verified by the executable evidence targets named by its requirement.
  - Metadata linkage checks are drift guards only and do not prove this capability behavior.

evidence_required:
  - commit_sha
  - package_version
  - test_id
  - result
