[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "calibrated_explanations"
version = "1.0.0-rc-dev"
description = "Calibrated Explanations"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Tuwe Löfström", email = "tuvelofstrom@gmail.com"},
    {name = "Cecilia Sönströd", email = "cecilia.sonstrod@hh.se"},
    {name = "Johan Löfström", email = "johanlofstrom@users.noreply.github.com"},
    {name = "UlfJohansson", email = "ulfjohansson@users.noreply.github.com"},
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas",
    "crepes>=0.7.1",
    "scikit-learn",
    "lime",
    "shap",
    "venn-abers>=1.3.1",
    "joblib",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-timeout",
    "pylint",
    "isort",
    "black",
    "matplotlib",
    "joblib",
    "ipython",
    "ipykernel",
    "jupyter",
    "numpydoc",
    "sphinx",
    "sphinx-rtd-theme",
    "sphinx-copybutton",
    "sphinx-autoapi",
    "sphinxcontrib-mermaid",
]
performance = [
    "matplotlib",
    "joblib",
    "ipython",
    "ipykernel",
    "jupyter",
]
viz = [
    "matplotlib",
]

[project.urls]
"Homepage" = "https://github.com/Moffran/calibrated_explanations"
"Bug Tracker" = "https://github.com/Moffran/calibrated_explanations/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
numpy = [
    "numpy>=1.24",
]
joblib = [
    "joblib",
]
src = [
    "src",
]
addopts = "-q"
testpaths = [
    "tests",
]
markers = [
    "slow: marks tests as slow (can be skipped in FAST_TESTS)",
    "integration: marks integration tests",
    "viz: marks visualization tests (optional extras)",
    "viz_render: marks tests that call matplotlib_adapter.render() (may fail with coverage due to lazy loading conflicts per ADR-023)",
    "platform_dependent: marks tests that depend on platform-specific behavior (paths, system calls, etc.)",
]
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
    "error::FutureWarning",
    "error:.*fall.*back.*:UserWarning",
    "ignore:.*(parseString|resetCache|enablePackrat).*deprecated.*:DeprecationWarning",
    "ignore:.*L-BFGS-B solver.*:DeprecationWarning",
    "ignore:Auto-close.*backend switching.*:DeprecationWarning:matplotlib.*",
    "ignore::UserWarning",
    "ignore:numpy.ufunc size changed, may indicate binary incompatibility.*:RuntimeWarning",
    "ignore:Setting the shape on a NumPy array has been deprecated in NumPy 2.5.*:DeprecationWarning:joblib.*",
    "ignore:The legacy module 'calibrated_explanations.core' is deprecated; import from the 'calibrated_explanations.core' package instead.:DeprecationWarning",
    "ignore:The 'calibrated_explanations.perf' module is deprecated.*:DeprecationWarning",
    "ignore:Importing from 'calibrated_explanations.core.calibration' is deprecated.*:DeprecationWarning",
    "ignore:_read_pyproject_section is deprecated.*:DeprecationWarning",
    "ignore:_split_csv is deprecated.*:DeprecationWarning",
    "ignore:_coerce_string_tuple is deprecated.*:DeprecationWarning",
    "ignore:_assign_weight_scalar is deprecated.*:DeprecationWarning",
    "ignore:_feature_task is deprecated.*:DeprecationWarning",
    "ignore:_legacy_payload is deprecated.*:DeprecationWarning",
    "ignore:The py23 module has been deprecated:DeprecationWarning:fontTools.misc.py23",
]

[tool.coverage.run]
branch = true
source = [
    "src/calibrated_explanations",
]
omit = [
    "*/tests/*",
    "*/test_*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self\.debug",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 100

[tool.pylint.messages_control]
disable = [
    "C0114",  # missing-module-docstring
    "C0115",  # missing-class-docstring
    "C0116",  # missing-function-docstring
    "R0913",  # too-many-arguments
    "R0914",  # too-many-locals
    "R0915",  # too-many-statements
    "W0212",  # protected-access
    "W0611",  # unused-import
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.MASTER]
ignore-paths = ['src/calibrated_explanations/old']

[tool.numpydoc_validation]
checks = [
    "all",
    "EX01",
    "SA01",
    "ES01",
]
exclude = [
    '\\.__init__$',
    '\\.__repr__$',
    '\\.__str__$',
]

[tool.pylint.basic]
good-names = [
    "a", "b", "c", "d", "e", "f", "g", "h", "i", "j", "k", "l", "m",
    "n", "o", "p", "q", "r", "s", "t", "u", "v", "w", "x", "y", "z",
    "X", "Y",
    "df",
    "ax",
    "ex",
    "ok",
    "lr",
]

[tool.pylint.design]
max-args = 20
max-attributes = 20
max-bool-expr = 10
max-branches = 20
max-locals = 30
max-public-methods = 30
max-returns = 10
max-statements = 100
min-public-methods = 1

[tool.pylint.similarities]
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
ignore-signatures = true

[tool.pylint.string]
check-quote-consistency = true

[tool.pylint.typecheck]
ignored-modules = [
    "numpy",
    "scipy",
    "sklearn",
    "pandas",
    "matplotlib",
    "venn_abers",
]

[tool.pylint.imports]
known-third-party = [
    "numpy",
    "pandas",
    "scipy",
    "sklearn",
    "matplotlib",
    "joblib",
    "venn_abers",
    "crepes",
    "lime",
    "shap",
]

[tool.pylint.convention]
convention = "numpy"
