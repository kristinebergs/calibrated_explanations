name: setup-ce-python
description: >-
  Set up Python with pip caching and install calibrated_explanations with
  pinned (constraints.txt) dependencies. Centralizes the Python environment
  setup permitted by v0.11.6 Task 60 / ADR-035.
inputs:
  python-version:
    description: Python version to install
    required: false
    default: '3.11'
  extras:
    description: Comma-separated extras to install (empty for core-only)
    required: false
    default: 'dev'
  editable:
    description: Install the package in editable mode (true/false)
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: |
          requirements.txt
          constraints.txt
          pyproject.toml
    - name: Install dependencies (constrained)
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install --upgrade pip
        pip install -r requirements.txt -c constraints.txt
        if [ -n "${{ inputs.extras }}" ]; then
          spec=".[${{ inputs.extras }}]"
        else
          spec="."
        fi
        if [ "${{ inputs.editable }}" = "true" ]; then
          pip install -e "$spec" -c constraints.txt
        else
          pip install "$spec" -c constraints.txt
        fi
